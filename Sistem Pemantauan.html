/* Frutiger dipakai bila terpasang di perangkat: 45 Light untuk teks biasa, 55 Roman untuk semi-tebal, 65 Bold untuk tebal */
@font-face{font-family:"BI Frutiger";font-weight:400;src:local("Frutiger LT Std 45 Light"),local("FrutigerLTStd-Light"),local("Frutiger-Light"),local("Frutiger 45 Light"),local("Frutiger LT 45 Light"),local("FrutigerLT-Light")}
@font-face{font-family:"BI Frutiger";font-weight:500 600;src:local("Frutiger LT Std 55 Roman"),local("FrutigerLTStd-Roman"),local("Frutiger-Roman"),local("Frutiger 55 Roman"),local("Frutiger LT 55 Roman"),local("FrutigerLT-Roman")}
@font-face{font-family:"BI Frutiger";font-weight:700 800;src:local("Frutiger LT Std 65 Bold"),local("FrutigerLTStd-Bold"),local("Frutiger-Bold"),local("Frutiger 65 Bold"),local("Frutiger LT 65 Bold"),local("FrutigerLT-Bold")}
:root{
  /* Layout: pita biru tua dengan garis emas, kartu kontrol yang menempel di bawahnya, ringkasan kota, tiga kolom status dengan sparkline, lalu grafik IPA. */
  --navy:#0A2A5C;--navy2:#12408A;--gold:#D6AB3F;
  --bg:#EDF1F8;--panel:#FFFFFF;--ink:#0E1B33;--ink2:#43526D;--mute:#5E6D88;--line:#D8E0EE;--line2:#E9EEF7;
  --accent:#1C5CC4;--accent-soft:#E3ECFA;--spark:#8190A8;
  --bad-fill:#C4262E;--bad-on:#FFFFFF;--bad-ink:#9E1B22;--bad-soft:#FCE7E8;
  --warn-fill:#F0B429;--warn-on:#2A1A00;--warn-ink:#7F4A00;--warn-soft:#FDF0CF;
  --ok-fill:#17803D;--ok-on:#FFFFFF;--ok-ink:#12703A;--ok-soft:#E1F3E8;
  --band-bad:rgba(196,38,46,.09);--band-warn:rgba(240,180,41,.17);
  --shadow:0 10px 28px rgba(10,42,92,.14);--sel:#0A2A5C;
  --font:"BI Frutiger","Frutiger 45 Light","Frutiger LT Std 45 Light","Open Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08142A;--panel:#10213F;--ink:#E8EEFA;--ink2:#B2C0D8;--mute:#8D9DBA;--line:#223659;--line2:#1A2C4C;
    --accent:#78AEFF;--accent-soft:#17305C;--spark:#7284A3;
    --bad-fill:#EF6A6F;--bad-on:#2A0A0C;--bad-ink:#FF9A9E;--bad-soft:#40191D;
    --warn-fill:#F0B429;--warn-on:#2A1A00;--warn-ink:#F5C15A;--warn-soft:#3A2D0C;
    --ok-fill:#4CC384;--ok-on:#06210F;--ok-ink:#6FD69A;--ok-soft:#123222;
    --band-bad:rgba(239,106,111,.15);--band-warn:rgba(240,180,41,.16);
    --shadow:0 10px 28px rgba(0,0,0,.45);--sel:#2457B5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08142A;--panel:#10213F;--ink:#E8EEFA;--ink2:#B2C0D8;--mute:#8D9DBA;--line:#223659;--line2:#1A2C4C;
  --accent:#78AEFF;--accent-soft:#17305C;--spark:#7284A3;
  --bad-fill:#EF6A6F;--bad-on:#2A0A0C;--bad-ink:#FF9A9E;--bad-soft:#40191D;
  --warn-fill:#F0B429;--warn-on:#2A1A00;--warn-ink:#F5C15A;--warn-soft:#3A2D0C;
  --ok-fill:#4CC384;--ok-on:#06210F;--ok-ink:#6FD69A;--ok-soft:#123222;
  --band-bad:rgba(239,106,111,.15);--band-warn:rgba(240,180,41,.16);
  --shadow:0 10px 28px rgba(0,0,0,.45);--sel:#2457B5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,p{margin:0}
h1{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;line-height:1.3;font-weight:700;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

.band::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 15px)}
.bandin{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px}
.band .sub{margin-top:6px;color:#C9D6EE;font-size:14px;max-width:760px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;border:1px solid rgba(214,171,63,.65);color:#F1DC9F;background:rgba(10,42,92,.35)}
.tag.d{border-color:rgba(255,255,255,.32);color:#EEF3FC;background:rgba(7,30,68,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.bandin>div:first-child{padding-right:52px}
.band h1,.band .sub{text-shadow:0 1px 10px rgba(6,24,56,.55)}
/* Menu titik tiga */
.mn{position:absolute;top:-14px;right:16px;z-index:30}
.mbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(10,42,92,.35);color:#fff;cursor:pointer}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.7)}
.mbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.menu{position:absolute;top:46px;right:0;width:max-content;min-width:220px;padding:6px;border-radius:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:42px;white-space:nowrap;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink)}
.mi:hover,.mi:focus-visible{background:var(--accent-soft);outline:none}
.mi:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.mi svg{flex:none;width:16px;height:16px;color:var(--accent);visibility:hidden}
.mi[aria-checked="true"] svg{visibility:visible}
.mi[aria-checked="true"]{font-weight:800}
.vw{display:flex;flex-direction:column;gap:18px}
.vw[hidden]{display:none}

.main{display:flex;flex-direction:column;gap:18px;padding-bottom:56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}

/* Kontrol */
.ctl{margin-top:-46px;position:relative;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg);border:1px solid var(--line);flex:1 1 360px;max-width:560px}
.tab{flex:1 1 auto;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 8px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab:hover{background:var(--accent-soft);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sel);color:#fff;box-shadow:0 2px 8px rgba(10,42,92,.28)}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad-fill);color:var(--bad-on);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.bd[hidden]{display:none}
.dctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.dategroup{display:flex;gap:6px}
input[type=date],.sel{height:42px;min-width:150px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0 10px;font-size:14px}
.sel{min-width:170px;font:inherit;font-size:14px}
.btn{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.sq{width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.btn.pri{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{flex:1 0 100%;font-size:13px;color:var(--ink2);min-height:0}
.note:empty{display:none}
.note.err{color:var(--bad-ink)}

/* Ringkasan kota */
.sum{border-left:6px solid var(--c,var(--ok-fill));display:flex;flex-direction:column;gap:10px}
.sum.s2{--c:var(--bad-fill)}.sum.s1{--c:var(--warn-fill)}.sum.s0{--c:var(--ok-fill)}
.verdict{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:15px;font-weight:500}
.verdict svg{flex:none;margin-top:2px}
.s2 .verdict svg{color:var(--bad-ink)}.s1 .verdict svg{color:var(--warn-ink)}.s0 .verdict svg{color:var(--ok-ink)}
.sbar{display:flex;gap:2px;height:30px}
.sb{display:flex;align-items:center;padding:0 10px;border-radius:4px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.sb.t2{background:var(--bad-fill);color:var(--bad-on)}.sb.t1{background:var(--warn-fill);color:var(--warn-on)}.sb.t0{background:var(--ok-fill);color:var(--ok-on)}
.hint{font-size:13px;color:var(--ink2)}

/* Kolom status */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.col{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.col.t2{--c:var(--bad-fill);--soft:var(--bad-soft);--ci:var(--bad-ink)}
.col.t1{--c:var(--warn-fill);--soft:var(--warn-soft);--ci:var(--warn-ink)}
.col.t0{--c:var(--ok-fill);--soft:var(--ok-soft);--ci:var(--ok-ink)}
.colhead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--soft);color:var(--ci)}
.colhead .n{font-size:38px;line-height:1;font-weight:800}
.colhead .lab{display:flex;flex-direction:column;line-height:1.3;font-size:13px}
.colhead .lab b{font-size:16px;font-weight:700}
.colhead svg{margin-left:auto;flex:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;align-items:center;gap:2px 10px;width:100%;min-height:60px;padding:8px 16px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.rl{display:flex;flex-direction:column;min-width:0}
.nm{font-size:14.5px;font-weight:600;line-height:1.25}
.pr{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.why{grid-column:1/-1;font-size:12.5px;line-height:1.4;color:var(--ink2);padding:2px 0 2px}
.cdesc{padding:9px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;line-height:1.4;color:var(--ink2)}
.sp svg{display:block;overflow:visible}
.sa{fill:var(--accent);opacity:.12}.sl{fill:none;stroke:var(--spark);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.sd{stroke:var(--panel);stroke-width:2}
.sd.s2{fill:var(--bad-fill)}.sd.s1{fill:var(--warn-fill)}.sd.s0{fill:var(--ok-fill)}
.chip{min-width:62px;text-align:center;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ci);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:14px 16px;color:var(--mute);font-size:13px}
.nalist{font-size:13px;color:var(--ink2);margin-top:8px}
.nalist:empty{display:none}

/* Grafik */
.charthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px}
.csub{color:var(--ink2);font-size:13px}
.cpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 16px}
.cp{display:flex;align-items:center;justify-content:flex-start;gap:6px;min-width:0;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.cp svg{width:15px;height:15px;flex:none;color:var(--ci)}
.cp.t0{--ci:var(--ok-ink)}.cp.t1{--ci:var(--warn-ink)}.cp.t2{--ci:var(--bad-ink)}
.cp:hover{background:var(--accent-soft)}
.cp span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp[aria-pressed="true"]{padding:0 11px;border:2px solid var(--sel);background:var(--accent-soft);font-weight:800}
.winwrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.wl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.wins{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.wins button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.wins button:hover{background:var(--accent-soft);color:var(--ink)}
.wins button[aria-pressed="true"]{background:var(--sel);color:#fff}
.ro{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:12px 0 4px}
.ro .big{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.ro .cap{font-size:13px;color:var(--ink2)}
.ro .chip{font-size:14px;padding:4px 12px}
/* Status dan rincian jendela */
.stat{margin:12px 0 10px;padding:12px 14px;border-radius:10px;background:var(--soft);border-left:5px solid var(--c)}
.stat.t2{--c:var(--bad-fill);--soft:var(--bad-soft);--ci:var(--bad-ink)}
.stat.t1{--c:var(--warn-fill);--soft:var(--warn-soft);--ci:var(--warn-ink)}
.stat.t0{--c:var(--ok-fill);--soft:var(--ok-soft);--ci:var(--ok-ink)}

/* ===== IHK ===== */
const H=DATA.H,HM=H.m,HV=H.v,HT=HM.length,IY=12,MINP=24,IS=IY+MINP;
/* Status dari inflasi tahunan (y-o-y). Pembanding: rata-rata dan SD seluruh y-o-y sebelum bulan itu, per kota, minimal 24 nilai
   (y-o-y pertama Jan 2023, jadi status mulai Jan 2025). Warning bila di atas rata-rata + 1 SD, Alert bila di atas rata-rata + 2 SD.
   Sasaran 2,5% +/- 1 hanya acuan, tidak menentukan status. Inflasi bulanan (m-to-m) hanya konteks. */
const LOWB=1.5,HIGHB=3.5,TGT=2.5;
const nm2=v=>Math.abs(v).toFixed(2).replace('.',',');
const p2=v=>v==null?'–':(v<-0.005?'−':'')+nm2(v)+'%';
const ix=v=>v.toFixed(2).replace('.',',');
const mo=t=>+HM[t].slice(5,7)-1;
const ml=t=>BL[mo(t)]+' '+HM[t].slice(0,4);
const ms=t=>BL[mo(t)]+' '+HM[t].slice(2,4);
const mf=t=>BF[mo(t)]+' '+HM[t].slice(0,4);
const mtm=(k,t)=>t>=1?(HV[k][t]/HV[k][t-1]-1)*100:null;
const yoy=(k,t)=>t>=IY?(HV[k][t]/HV[k][t-IY]-1)*100:null;
const BS=K.map((_,k)=>{const mu=[],sd=[];
for(let t=0;t<HT;t++){
if(t<IS){mu.push(null);sd.push(null);continue}
let n=0,s=0;for(let u=IY;u<t;u++){s+=yoy(k,u);n++}
const m0=s/n;let q=0;for(let u=IY;u<t;u++){const d=yoy(k,u)-m0;q+=d*d}
mu.push(m0);sd.push(Math.sqrt(q/(n-1)))}
return {mu:mu,sd:sd}});
const bw=(k,t)=>BS[k].mu[t]+BS[k].sd[t];
const ba=(k,t)=>BS[k].mu[t]+2*BS[k].sd[t];
const catI=(k,t)=>{const y=yoy(k,t);return y>ba(k,t)?2:y>bw(k,t)?1:0};
const posY=y=>y>HIGHB?'Di Atas Sasaran':y<LOWB?'Di Bawah Sasaran':'Dalam Sasaran';
const TN=['ok','warn','bad'];
const chipI=(t,txt)=>{const c=el('span','chip',txt);c.style.cssText='--soft:var(--'+TN[t]+'-soft);--ci:var(--'+TN[t]+'-ink)';return c};
function sentI(k,t){
const c=catI(k,t),a='Inflasi tahunan '+p2(yoy(k,t));
if(c===2)return a+', melewati batas Alert '+p2(ba(k,t))+' (rata-rata + 2 SD).';
if(c===1)return a+', di atas batas Warning '+p2(bw(k,t))+' (rata-rata + 1 SD), belum melewati batas Alert '+p2(ba(k,t))+'.';
return a+', belum melewati batas Warning '+p2(bw(k,t))+' (rata-rata + 1 SD).'}

let ti=HT-1,kd='y',rg=0,curI=-1;
const tabsI=$('tabsI');
K.forEach((k,i)=>{
const b=el('button','tab');b.type='button';b.id='itab'+i;b.dataset.k=i;b.setAttribute('role','tab');
b.append(el('span','tn',k));tabsI.append(b)});
tabsI.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;ki=+t.dataset.k;renderI()});
tabsI.addEventListener('keydown',e=>{
if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
ki=(ki+(e.key==='ArrowRight'?1:K.length-1))%K.length;renderI();$('itab'+ki).focus();e.preventDefault()});
const selI=$('mI');
for(let t=HT-1;t>=IS;t--){const o=document.createElement('option');o.value=t;o.textContent=mf(t);selI.append(o)}
selI.onchange=()=>{ti=+selI.value;renderI()};
$('prevI').onclick=()=>{ti=Math.max(IS,ti-1);renderI()};
$('nextI').onclick=()=>{ti=Math.min(HT-1,ti+1);renderI()};
$('latestI').onclick=()=>{ti=HT-1;renderI()};
document.querySelectorAll('[data-kd]').forEach(b=>b.onclick=()=>{kd=b.dataset.kd;renderI()});
document.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{rg=+b.dataset.rg;renderI()});
$('kcsI').addEventListener('click',e=>{const b=e.target.closest('.kc');if(!b)return;ki=+b.dataset.k;renderI();const nb=$('kcsI').querySelector('[data-k="'+ki+'"]');if(nb)nb.focus()});

function renderSumI(){
const t=catI(ki,ti);
$('sumI').className='card sum s'+t;
$('lhI').textContent=K[ki]+', '+mf(ti);
const v=$('verdictI');v.textContent='';
const ic=document.createElement('span');ic.innerHTML=ICON[t];v.append(ic.firstChild);
v.append(el('span',null,sentI(ki,ti)));
const box=$('kcsI');box.textContent='';
K.forEach((k,i)=>{
const tt=catI(i,ti),mm=mtm(i,ti),yy=yoy(i,ti);
const b=el('button','kc t'+tt);b.type='button';b.dataset.k=i;b.setAttribute('aria-pressed',String(i===ki));
b.setAttribute('aria-label',k+', inflasi tahunan '+p2(yy)+', '+SL[tt]+', inflasi bulanan '+p2(mm));
const l=el('span','kcl');l.append(el('span','nm',k),el('span','pr','Bulanan '+p2(mm)));
b.append(l,el('span','chip',SL[tt]+' '+p2(yy)));box.append(b)})}

function chartI(){
const box=$('chartI'),tip=$('tipI'),isM=kd==='m';
const t=catI(ki,ti),m=mtm(ki,ti),y=yoy(ki,ti);
$('ctitleI').textContent=(isM?'Inflasi Bulanan, ':'Inflasi Tahunan, ')+K[ki];
const a=rg?Math.max(IS,ti-rg+1):IS,b=ti,n=b-a+1;
$('csubI').textContent=ml(a)+' sampai '+ml(b);
tip.hidden=true;
/* rincian bulan terpilih */
const tl=$('tilesI');tl.textContent='';
const tile=(title,chip,big,rows)=>{
const c=el('div','wc'),hd=el('div','wch');hd.append(el('b',null,title));if(chip)hd.append(chip);
c.append(hd,el('div','bg',big));
rows.forEach(r=>{const w=el('div','wr');w.append(el('span',null,r[0]),el('span','v',r[1]));c.append(w)});tl.append(c)};
tile('Tahunan (y-o-y)',chipI(t,SL[t]),p2(y),[['Rata-Rata Riwayat',p2(BS[ki].mu[ti])],['Batas Warning (+1 SD)',p2(bw(ki,ti))],['Batas Alert (+2 SD)',p2(ba(ki,ti))]]);
tile('Sasaran Inflasi',null,'2,5% ± 1',[['Rentang','1,5% sampai 3,5%'],['Posisi Tahunan',posY(y)]]);
tile('IHK',null,ix(HV[ki][ti]),[[ml(ti-1),ix(HV[ki][ti-1])],[ml(ti-IY),ix(HV[ki][ti-IY])],['Bulanan (m-to-m)',p2(m)]]);
$('legI').innerHTML=isM?'<span><i class="sw" style="background:var(--accent);opacity:.55"></i>Inflasi Bulanan (tanpa Status)</span>'
:'<span><i class="lk"></i>Inflasi Tahunan</span><span><i class="sw" style="background:var(--ok-fill)"></i>Normal</span><span><i class="sw" style="background:var(--warn-fill)"></i>Warning</span><span><i class="sw" style="background:var(--bad-fill)"></i>Alert</span><span><i class="lk" style="border-top:2px dashed var(--warn-ink)"></i>Batas Warning, Rata-Rata + 1 SD</span><span><i class="lk" style="border-top:2px dashed var(--bad-ink)"></i>Batas Alert, Rata-Rata + 2 SD</span>';
/* grafik */
const W=Math.max(300,Math.floor(box.clientWidth||720)),narrow=W<520;
const L=narrow?46:54,R=14,TA=14,BB=narrow?210:260,H2=BB+30,pw=W-L-R;
const vals=[];for(let i=a;i<=b;i++)vals.push(isM?mtm(ki,i):yoy(ki,i));
let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
if(isM){lo=Math.min(0,lo);const pd=(hi-lo)*0.08;if(lo<0)lo-=pd;hi+=pd}
else{for(let i=a;i<=b;i++)hi=Math.max(hi,ba(ki,i));lo=Math.min(0,Math.floor(lo));hi=Math.max(4,Math.ceil(hi+0.2))}
const rng=hi-lo,st=rng<=3?0.5:rng<=7?1:rng<=14?2:5;
const Y=v=>TA+(hi-v)/(hi-lo)*(BB-TA);
const X=isM?(i=>L+(i-a+0.5)/n*pw):(i=>L+(n>1?(i-a)/(n-1):0)*pw);
let g='';
if(!isM){
const pts=[];for(let i=a;i<=b;i++)pts.push([X(i),Y(bw(ki,i)),Y(ba(ki,i))]);
const f=pts[0],l=pts[pts.length-1],ex=[[L,f[1],f[2]]].concat(pts,[[W-R,l[1],l[2]]]),rv=ex.slice().reverse();
const j=(arr,fn)=>arr.map(p=>p[0].toFixed(1)+' '+fn(p).toFixed(1)).join('L');
g+='<path class="bb1" d="M'+j(ex,p=>p[1])+'L'+j(rv,p=>p[2])+'Z"/><path class="bb2" d="M'+j(ex,p=>p[2])+'L'+j(rv,()=>TA)+'Z"/>'}
for(let v=Math.ceil(lo/st-1e-9)*st;v<=hi+1e-9;v+=st){
const yy=Y(v),lab=(v<0?'−':'')+Math.abs(v).toFixed(st<1?1:0).replace('.',',')+'%';
g+='<line class="'+(Math.abs(v)<1e-9?'gz':'gl')+'" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/><text class="ax" x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end">'+lab+'</text>'}
if(!isM){
const mk=fn=>{let d='';for(let i=a;i<=b;i++){const x=X(i).toFixed(1),yy=Y(fn(ki,i)).toFixed(1);if(i===a)d+='M'+L+' '+yy+'L';else d+='L';d+=x+' '+yy}return d+'L'+(W-R)+' '+Y(fn(ki,b)).toFixed(1)};
g+='<path class="th w" fill="none" d="'+mk(bw)+'"/><path class="th b" fill="none" d="'+mk(ba)+'"/>'}
const q=narrow?2:4;
for(let j=0;j<=q;j++){
const i=a+Math.round((n-1)*j/q),an=j===0?'start':j===q?'end':'middle';
g+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H2-8)+'" text-anchor="'+(n<2?'start':an)+'">'+ms(i)+'</text>'}
if(isM){
const bwd=Math.max(2,Math.min(26,pw/n*0.62)),y0=Y(0);
for(let i=a;i<=b;i++){const v=mtm(ki,i),yy=Y(v),top=Math.min(yy,y0),h=Math.max(1,Math.abs(yy-y0));
g+='<rect class="bar c0'+(i===b?' sl2':'')+'" x="'+(X(i)-bwd/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bwd.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5"/>'}}
else{
let pl='';for(let i=a;i<=b;i++)pl+=(i===a?'M':'L')+X(i).toFixed(1)+' '+Y(yoy(ki,i)).toFixed(1);
g+='<path class="pl" d="'+pl+'"/>';
for(let i=a;i<=b;i++)g+='<circle class="ed s'+catI(ki,i)+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(yoy(ki,i)).toFixed(1)+'" r="'+(i===b?5:3.2)+'"/>'}
g+='<line id="xhI" class="xh" x1="0" y1="'+TA+'" x2="0" y2="'+BB+'" visibility="hidden"/><circle id="hdI" class="hd p" r="5" visibility="hidden"/><rect id="ovI" x="'+L+'" y="'+TA+'" width="'+pw+'" height="'+(BB-TA)+'" fill="transparent"/>';
const lab='Grafik inflasi '+(isM?'bulanan ':'tahunan ')+K[ki]+', '+ml(a)+' sampai '+ml(b)+'. Pada '+ml(b)+' '+(isM?'inflasi bulanan '+p2(m):'inflasi tahunan '+p2(y)+', status '+SL[t])+'.';
box.innerHTML='<svg viewBox="0 0 '+W+' '+H2+'" width="'+W+'" height="'+H2+'" role="img" aria-label="'+lab+'">'+g+'</svg>';
const sv=box.querySelector('svg'),ov=sv.querySelector('#ovI'),xh=sv.querySelector('#xhI'),hd=sv.querySelector('#hdI');
const showAt=i=>{
curI=i;const x=X(i),tt=catI(ki,i);
xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
if(!isM){hd.setAttribute('cx',x);hd.setAttribute('cy',Y(yoy(ki,i)));hd.setAttribute('visibility','visible')}
tip.textContent='';tip.append(el('div','td',mf(i)));
const row=(k,v,chip)=>{const r=el('div','tr');r.append(el('span','nmx',k),el('strong',null,v));if(chip)r.append(chip);tip.append(r)};
row('Tahunan',p2(yoy(ki,i)),chipI(tt,SL[tt]));
row('Batas Warning',p2(bw(ki,i)));
row('Batas Alert',p2(ba(ki,i)));
row('Bulanan',p2(mtm(ki,i)));
row('IHK',ix(HV[ki][i]));
tip.hidden=false;
const tw=tip.offsetWidth;let left=x+16;if(left+tw>W)left=x-tw-16;if(left<0)left=0;
tip.style.left=left+'px';tip.style.top=(TA+6)+'px'};
const hideI=()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');hd.setAttribute('visibility','hidden')};
const idxAt=e=>{const r=sv.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width;
const i=isM?a+Math.floor((mx-L)/pw*n):a+Math.round((mx-L)/pw*(n-1));return Math.max(a,Math.min(b,i))};
ov.addEventListener('pointermove',e=>showAt(idxAt(e)));
ov.addEventListener('pointerdown',e=>showAt(idxAt(e)));
ov.addEventListener('pointerleave',hideI);
box.onfocus=()=>showAt(curI>=a&&curI<=b?curI:b);
box.onblur=()=>{hideI();curI=-1};
box.onkeydown=e=>{
let i=curI>=a&&curI<=b?curI:b;const s=e.shiftKey?3:1;
if(e.key==='ArrowLeft')i-=s;else if(e.key==='ArrowRight')i+=s;else if(e.key==='Home')i=a;else if(e.key==='End')i=b;else return;
e.preventDefault();showAt(Math.max(a,Math.min(b,i)))};
/* tabel */
const tw=$('twI');tw.textContent='';
const tb=document.createElement('table'),th=document.createElement('thead'),hr=document.createElement('tr');
['Bulan','IHK','Tahunan','Batas Warning','Batas Alert','Bulanan','Status'].forEach(h=>hr.append(el('th',null,h)));
th.append(hr);tb.append(th);
const bd=document.createElement('tbody');
for(let i=b;i>=Math.max(IS,b-11);i--){
const tr=document.createElement('tr');
tr.append(el('td',null,mf(i)),el('td',null,ix(HV[ki][i])),el('td',null,p2(yoy(ki,i))),el('td',null,p2(bw(ki,i))),el('td',null,p2(ba(ki,i))),el('td',null,p2(mtm(ki,i))),el('td',null,SL[catI(ki,i)]));
bd.append(tr)}
tb.append(bd);tw.append(tb)}

function renderI(){
if(ti<IS||ti>=HT)ti=HT-1;
selI.value=String(ti);
$('prevI').disabled=ti<=IS;$('nextI').disabled=ti>=HT-1;
document.querySelectorAll('[data-kd]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kd===kd)));
document.querySelectorAll('[data-rg]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.rg===rg)));
K.forEach((k,i)=>{const t=$('itab'+i);t.setAttribute('aria-selected',String(i===ki));t.tabIndex=i===ki?0:-1});
renderSumI();chartI()}


/* ===== Menu dan pergantian tampilan ===== */
let view='e';
const mbtn=$('mbtn'),menu=$('menu'),mitems=[...menu.querySelectorAll('.mi')];
function openMenu(idx){menu.hidden=false;mbtn.setAttribute('aria-expanded','true');
const f=idx!=null?idx:mitems.findIndex(x=>x.dataset.v===view);(mitems[f]||mitems[0]).focus()}
function closeMenu(back){menu.hidden=true;mbtn.setAttribute('aria-expanded','false');if(back)mbtn.focus()}
mbtn.onclick=()=>{menu.hidden?openMenu():closeMenu(true)};
mbtn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openMenu(e.key==='ArrowUp'?mitems.length-1:0)}});
menu.addEventListener('keydown',e=>{
const i=mitems.indexOf(document.activeElement);
if(e.key==='Escape'){e.preventDefault();closeMenu(true)}
else if(e.key==='ArrowDown'){e.preventDefault();mitems[(i+1)%mitems.length].focus()}
else if(e.key==='ArrowUp'){e.preventDefault();mitems[(i+mitems.length-1)%mitems.length].focus()}
else if(e.key==='Home'){e.preventDefault();mitems[0].focus()}
else if(e.key==='End'){e.preventDefault();mitems[mitems.length-1].focus()}
else if(e.key==='Tab')closeMenu(false)});
menu.addEventListener('click',e=>{const b=e.target.closest('.mi');if(!b)return;setView(b.dataset.v);closeMenu(true)});
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.mn'))closeMenu(false)});
function setView(v){
view=v;
mitems.forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===v)));
$('vE').hidden=v!=='e';$('vI').hidden=v!=='i';
if(v==='e'){
$('ttl').textContent='Harga Komoditas Sibolga';
$('sub').textContent='Wilayah Kerja Kantor Perwakilan Bank Indonesia Sibolga';
$('tg1').hidden=true;$('tg1').textContent='';
$('upd').textContent='Data Terakhir: '+fdn(D[N-1]);
document.title='Harga Komoditas Sibolga';render()}
else{
$('ttl').textContent='Indeks Harga Konsumen Sibolga';
$('sub').textContent='Wilayah Kerja Kantor Perwakilan Bank Indonesia Sibolga';
$('tg1').hidden=false;$('tg1').textContent='Y-o-y, Rata-Rata + 1 SD dan 2 SD';
$('upd').textContent='Data Terakhir: '+mf(HT-1);
document.title='Indeks Harga Konsumen Sibolga';renderI()}}

let rz=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(view==='e'){renderSum(classify(ki,i1));chart()}else chartI()})});
render();
})();
</script>
